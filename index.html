<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#131315" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Doubles team stacking, fair player rotation, and scorekeeping for pickleball." />
    <title>Pickleball Stacking</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply a saved theme before first paint, otherwise an explicit choice flashes
         the OS theme for a frame while the bundle loads. Kept inline and tiny on purpose. -->
    <script>
      try {
        var t = localStorage.getItem('stacking:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#101214' : '#f6f5f3')
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
