<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#f6f5f3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS ignores the manifest's theme_color and offers only white / black / black-translucent
         here, so `black-translucent` is the only way to get an edge-to-edge app (and the only one
         that doesn't put a white bar above a dark theme). Its cost is a WebKit quirk: the document
         is extended up under the status bar but the layout viewport is NOT grown to match, so the
         page ends up short by exactly env(safe-area-inset-top). src/index.css adds that back. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Doubles team stacking, fair player rotation, and scorekeeping for pickleball." />
    <title>Pickleball Stacking</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply a saved theme before first paint, otherwise an explicit choice flashes
         the OS theme for a frame while the bundle loads. Kept inline and tiny on purpose. -->
    <script>
      try {
        var t = localStorage.getItem('stacking:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        // The chrome color has to be resolved even on `system`, otherwise an install
        // that follows the OS keeps the static color and paints a mismatched bar
        // above and below the app.
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', dark ? '#101214' : '#f6f5f3')
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
